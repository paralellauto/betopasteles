<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskdog</title>
    <style>
      /* Esta ventana flota sobre el escritorio de verdad, así que todo tiene
         que ser transparente menos el propio perro. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      /* Sólo aparece si algo falla. Ver el comentario de abajo. */
      #fatal {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        background: #c00;
        color: #fff;
        font: bold 13px/1.45 monospace;
        padding: 6px 10px;
        white-space: pre-wrap;
        max-height: 120px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="fatal"></div>

    <script>
      // Esta ventana no tiene barra de título ni consola a la vista: si algo
      // falla, sin esto se queda simplemente en blanco y no hay forma de saber
      // por qué. Nos costó media tarde averiguarlo. Ahora el error se escribe
      // en la propia ventana.
      //
      // El `true` del final es importante: activa la fase de captura. Cuando un
      // <script> no consigue cargarse, ese error no burbujea hasta window y sin
      // la captura pasaría desapercibido.
      window.addEventListener(
        "error",
        function (e) {
          var caja = document.getElementById("fatal");
          caja.style.display = "block";
          caja.textContent +=
            (e.target && e.target.tagName
              ? "No cargó: <" +
                e.target.tagName.toLowerCase() +
                "> " +
                (e.target.src || e.target.href || "")
              : "Error: " +
                (e.message || e.type) +
                (e.filename ? "  (" + e.filename + ":" + e.lineno + ")" : "")) + "\n";
        },
        true,
      );
    </script>

    <div id="root"></div>
    <script type="module" src="/src/dogWindow.jsx"></script>
  </body>
</html>
