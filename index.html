<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskdog</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      /* ---- TEMPORAL, solo para depurar --------------------------------- */
      #pasos {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        background: #004c99;
        color: #fff;
        font: bold 13px/1.5 monospace;
        padding: 4px 10px;
        white-space: pre-wrap;
      }
      #fatal {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2147483647;
        background: #c00;
        color: #fff;
        font: bold 13px/1.45 monospace;
        padding: 6px 10px;
        white-space: pre-wrap;
        max-height: 120px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <!-- TEMPORAL: los pasos se van sumando aquí y NUNCA se borran, para poder
         leer hasta dónde llegó el código. El cartel rojo de errores es un
         elemento aparte, así ya no pisa esta información. -->
    <div id="pasos">build 8 · HTML OK</div>
    <div id="fatal"></div>

    <script>
      (function () {
        var pasos = document.getElementById("pasos");
        var caja = document.getElementById("fatal");

        window.__ddPaso = function (t) {
          pasos.textContent += "  →  " + t;
        };
        function fallo(t) {
          caja.style.display = "block";
          caja.textContent += t + "\n";
        }
        window.__ddFallo = fallo;

        // ¡Con `true`! Sin la fase de captura no se detecta que un <script> no
        // haya podido cargarse: ese error no burbujea hasta window, y por eso
        // hasta ahora la ventana fallaba sin decir absolutamente nada.
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName) {
              fallo(
                "NO CARGO EL RECURSO: <" +
                  e.target.tagName.toLowerCase() +
                  "> " +
                  (e.target.src || e.target.href || ""),
              );
            } else {
              fallo(
                "ERROR: " +
                  (e.message || e.type) +
                  (e.filename ? "\n  en " + e.filename + ":" + e.lineno : ""),
              );
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (e) {
          fallo("PROMESA RECHAZADA: " + (e.reason && (e.reason.message || e.reason)));
        });

        setTimeout(function () {
          var root = document.getElementById("root");
          pasos.textContent +=
            "  |  #root tiene " + (root ? root.children.length : "?") + " hijos";
          if (!root || root.children.length === 0) fallo("React no dibujó nada en 3 s.");
        }, 3000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/dog.jsx"></script>
  </body>
</html>
