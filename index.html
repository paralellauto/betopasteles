<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deskdog</title>
    <style>
      /* This window floats over the real desktop, so everything must be
         see-through except the dog itself. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dog.jsx"></script>
  </body>
</html>
